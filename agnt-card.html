<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AGNT V3 Beta</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Space Grotesk', sans-serif;
    padding: 40px;
  }

  .card {
    width: 1000px;
    height: 1000px;
    background: linear-gradient(135deg, #fff7ec 0%, #fdebf0 55%, #fad6e3 100%);
    position: relative;
    overflow: hidden;
    color: #0a0a0a;
    font-family: 'Space Grotesk', sans-serif;
  }

  /* Dot grid */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.18) 1px, transparent 1.5px);
    background-size: 14px 14px;
    opacity: 0.4;
    pointer-events: none;
  }

  /* Top status row */
  .top {
    position: absolute;
    top: 36px;
    left: 36px;
    right: 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    z-index: 5;
  }

  .top-left {
    color: #e6126e;
    text-transform: uppercase;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #0a0a0a;
  }

  .top-right .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00b46a;
    box-shadow: 0 0 8px rgba(0, 180, 106, 0.6);
  }

  /* Central AGNT word with layered shadow */
  .hero {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -54%);
    text-align: center;
    z-index: 4;
  }

  .agnt-stack {
    position: relative;
    display: inline-block;
    line-height: 1;
  }

  .agnt-stack span {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 340px;
    letter-spacing: -18px;
    display: block;
    line-height: 0.85;
  }

  .agnt-shadow-3 {
    position: absolute;
    top: 22px;
    left: 26px;
    color: #fad6e3;
    z-index: 1;
  }
  .agnt-shadow-2 {
    position: absolute;
    top: 14px;
    left: 18px;
    color: #ffd4a8;
    z-index: 2;
  }
  .agnt-shadow-1 {
    position: absolute;
    top: 7px;
    left: 9px;
    color: #ff8fb1;
    z-index: 3;
  }
  .agnt-main {
    position: relative;
    color: #0a0a0a;
    z-index: 4;
  }

  /* V3 BETA stamp */
  .stamp {
    position: absolute;
    top: calc(50% + 200px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #0a0a0a;
    padding: 8px 18px;
    background: rgba(255, 255, 255, 0.4);
    border: 1.5px solid #0a0a0a;
    border-radius: 4px;
    z-index: 5;
  }

  /* Stats row */
  .stats {
    position: absolute;
    bottom: 170px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 36px;
    font-family: 'JetBrains Mono', monospace;
    z-index: 5;
    text-align: center;
  }

  .stat {
    padding: 14px 22px;
    background: rgba(255, 255, 255, 0.55);
    border: 1.5px solid #0a0a0a;
    border-radius: 10px;
  }

  .stat-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: #e6126e;
    text-transform: uppercase;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .stat-value {
    font-size: 16px;
    font-weight: 700;
    color: #0a0a0a;
    letter-spacing: -0.3px;
  }

  /* Closer */
  .closer {
    position: absolute;
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: #0a0a0a;
    letter-spacing: -1.5px;
    z-index: 5;
  }

  /* Bottom pill row */
  .bottom {
    position: absolute;
    bottom: 36px;
    left: 36px;
    right: 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border: 1.5px solid #0a0a0a;
    border-radius: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    background: rgba(255, 255, 255, 0.5);
    color: #0a0a0a;
  }

  .pill .pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .pill-dot.pink { background: #e6126e; }
  .pill-dot.blue { background: #2768f3; }

  .tut {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #0a0a0a;
  }
  .tut sup { font-size: 10px; vertical-align: super; }

</style>
</head>
<body>
  <div class="card">

    <!-- Top status -->
    <div class="top">
      <div class="top-left">V3.BETA // LIVE SOON</div>
      <div class="top-right">
        <div class="dot"></div>
        <span>MY.AGNT.SOCIAL</span>
      </div>
    </div>

    <!-- AGNT layered word -->
    <div class="hero">
      <div class="agnt-stack">
        <span class="agnt-shadow-3">AGNT</span>
        <span class="agnt-shadow-2">AGNT</span>
        <span class="agnt-shadow-1">AGNT</span>
        <span class="agnt-main">AGNT</span>
      </div>
    </div>

    <!-- V3 stamp -->
    <div class="stamp">V3 · BETA</div>

    <!-- Closer -->
    <div class="closer">when we grow, you grow.</div>

    <!-- Bottom pills -->
    <div class="bottom">
      <div class="pill">
        <div class="pill-dot pink"></div>
        <span>EVERYONE GETS AN AGENT</span>
      </div>
      <div class="tut">tut<sup>TM</sup></div>
      <div class="pill">
        <div class="pill-dot blue"></div>
        <span>ERC-8004 · ONCHAIN</span>
      </div>
    </div>

  </div>
</body>
</html>
