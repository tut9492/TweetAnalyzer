<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AGNT V3 Beta</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Space Grotesk', sans-serif;
    padding: 40px;
  }

  .card {
    width: 1080px;
    height: 1080px;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
    color: #f5f5f5;
  }

  /* Noise/grain texture */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 30%, rgba(255, 90, 31, 0.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0, 255, 140, 0.06), transparent 40%);
    pointer-events: none;
  }

  /* Top bar — terminal style */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 32px 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    letter-spacing: 1px;
    color: #888;
    border-bottom: 1px solid #1f1f1f;
  }

  .top-bar .left { display: flex; gap: 20px; align-items: center; }
  .top-bar .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff8c;
    box-shadow: 0 0 12px #00ff8c;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Big AGNT logo */
  .logo {
    position: absolute;
    top: 110px;
    left: 56px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .logo svg {
    width: 88px;
    height: 88px;
  }

  .logo-text {
    font-size: 84px;
    font-weight: 700;
    letter-spacing: -4px;
    line-height: 1;
    color: #f5f5f5;
  }

  /* Hero closer — the manifesto */
  .hero {
    position: absolute;
    top: 50%;
    left: 56px;
    right: 56px;
    transform: translateY(-50%);
  }

  .hero-line-1, .hero-line-2 {
    font-size: 160px;
    font-weight: 700;
    letter-spacing: -8px;
    line-height: 0.92;
    text-transform: uppercase;
  }

  .hero-line-1 { color: #f5f5f5; }
  .hero-line-2 {
    color: #ff5a1f;
    margin-left: 60px;
  }

  .hero-comma { color: #ff5a1f; }

  /* Stats — bottom */
  .stats-row {
    position: absolute;
    bottom: 130px;
    left: 56px;
    right: 56px;
    display: flex;
    gap: 60px;
    font-family: 'Space Mono', monospace;
  }

  .stat-line {
    flex: 1;
    border-left: 3px solid #ff5a1f;
    padding-left: 18px;
  }

  .stat-source {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: #f5f5f5;
    letter-spacing: -0.5px;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 32px 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    letter-spacing: 1px;
    color: #888;
    border-top: 1px solid #1f1f1f;
  }

  .anti-suits {
    color: #ff5a1f;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  .tut {
    font-family: 'Space Grotesk', sans-serif;
    color: #f5f5f5;
    font-weight: 700;
    font-size: 18px;
  }
  .tut sup { font-size: 10px; vertical-align: super; }
</style>
</head>
<body>
  <div class="card">

    <!-- Top bar -->
    <div class="top-bar">
      <div class="left">
        <div class="dot"></div>
        <span>AGNT.V3.BETA // LIVE SOON</span>
      </div>
      <div class="right">SYSTEM: AGENT_ECONOMY</div>
    </div>

    <!-- Logo -->
    <div class="logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="36" stroke="#f5f5f5" stroke-width="10" fill="none"/>
        <rect x="30" y="22" width="40" height="10" fill="#f5f5f5"/>
      </svg>
      <div class="logo-text">AGNT</div>
    </div>

    <!-- Hero manifesto line -->
    <div class="hero">
      <div class="hero-line-1">When we grow<span class="hero-comma">,</span></div>
      <div class="hero-line-2">you grow.</div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-line">
        <div class="stat-source">// McKinsey</div>
        <div class="stat-value">$3–5T agentic economy by 2030</div>
      </div>
      <div class="stat-line">
        <div class="stat-source">// Tether</div>
        <div class="stat-value">Trillion-agent economy on web3</div>
      </div>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
      <div class="anti-suits">&gt; NO SUITS. NO EXTRACTION.</div>
      <div class="tut">tut<sup>TM</sup></div>
    </div>

  </div>
</body>
</html>
