<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AGNT V3 Beta</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    padding: 40px;
  }

  .card {
    width: 1080px;
    height: 1080px;
    background: #E5E5E5;
    position: relative;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #000;
  }

  /* Top: AGNT logo */
  .logo {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo svg {
    width: 80px;
    height: 80px;
  }

  .logo-text {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
  }

  /* Middle: thesis */
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 50px;
    padding: 40px 0;
  }

  .label {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.5;
  }

  .stats {
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .stat {
    border-left: 6px solid #000;
    padding-left: 28px;
  }

  .stat-source {
    font-size: 20px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.6;
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1.05;
  }

  /* Bottom: closer + tut */
  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .closer {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.1;
    max-width: 70%;
  }

  .tut {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .tut sup {
    font-size: 12px;
    vertical-align: super;
  }

  /* V3 Beta tag */
  .version-tag {
    position: absolute;
    top: 80px;
    right: 80px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    border: 2px solid #000;
    padding: 8px 16px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- Top: AGNT logo -->
    <div class="logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="36" stroke="#000" stroke-width="10" fill="none"/>
        <rect x="30" y="22" width="40" height="10" fill="#000"/>
      </svg>
      <div class="logo-text">AGNT</div>
    </div>

    <div class="version-tag">V3 BETA</div>

    <!-- Middle: stats -->
    <div class="middle">
      <div class="label">The Agentic Economy</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-source">McKinsey</div>
          <div class="stat-value">$3–5 Trillion<br/>by 2030</div>
        </div>
        <div class="stat">
          <div class="stat-source">Tether</div>
          <div class="stat-value">Trillion-Agent<br/>Economy</div>
        </div>
      </div>
    </div>

    <!-- Bottom: closer + tut -->
    <div class="bottom">
      <div class="closer">When we grow,<br/>you grow.</div>
      <div class="tut">tut<sup>TM</sup></div>
    </div>
  </div>
</body>
</html>
